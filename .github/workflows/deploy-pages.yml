name: Deploy 词迹 Production and v1.1 Preview

on:
  push:
    branches: ["main"]
    paths:
      - "site.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source

      - name: Checkout v1.1 preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.1-dual-accent-audio
          path: preview-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare combined Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          # Current production app remains at /ci-ji/
          unzip -q production-source/site.zip -d site

          # v1.1 audio preview is isolated at /ci-ji/preview-v1-1/
          mkdir -p site/preview-v1-1
          unzip -q preview-source/site.zip -d site/preview-v1-1

          python3 - <<'PY'
          from pathlib import Path

          root = Path("site/preview-v1-1")
          old = b"/ci-ji/"
          new = b"/ci-ji/preview-v1-1/"
          text_suffixes = {
              ".html", ".js", ".css", ".json", ".webmanifest",
              ".txt", ".svg", ".xml", ".map"
          }

          changed = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              data = path.read_bytes()
              if old in data:
                  path.write_bytes(data.replace(old, new))
                  changed.append(str(path))

          print(f"Rewrote preview base path in {len(changed)} files")
          PY

          touch site/.nojekyll
          touch site/preview-v1-1/.nojekyll

          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          test -f site/preview-v1-1/index.html
          test -f site/preview-v1-1/manifest.webmanifest
          test -f site/preview-v1-1/sw.js

          audio_count=$(find site/preview-v1-1 -type f -name '*.mp3' | wc -l | tr -d ' ')
          echo "Preview MP3 count: ${audio_count}"
          test "${audio_count}" -eq 262

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy combined site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
